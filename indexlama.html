<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Target Nikah</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:12px;background:#f5f7f4;
 font-family:Arial,sans-serif;color:#222
}
.wrap{max-width:1100px;margin:auto}
.header{
 background:#69b34c;color:white;text-align:center;
 font-size:22px;font-weight:bold;padding:13px;border-radius:8px
}
.cards{
 display:grid;grid-template-columns:repeat(4,1fr);
 gap:10px;margin-top:10px
}
.card{
 background:white;border:1px solid #ddd;border-radius:8px;
 padding:8px;text-align:center
}
.card h3{margin:0 0 8px;font-size:14px}
.value{font-size:17px;font-weight:bold}
.target h3{background:#20a4e6;color:white}
.saved h3{background:#69b34c;color:white}
.progress h3{background:#f0a400;color:white}
.remaining h3{background:#e05b5b;color:white}

.section{
 margin-top:14px;background:white;border:1px solid #ddd;
 border-radius:8px;overflow:hidden
}
.section-title{
 background:#69b34c;color:white;font-weight:bold;padding:10px
}
.row{
 display:grid;grid-template-columns:1fr 180px;
 border-bottom:1px solid #ddd;padding:9px
}
.total{font-weight:bold}
.progressbox{padding:12px}
.bar{height:28px;background:#e9eee8;border:1px solid #ccc;border-radius:6px;overflow:hidden}
.fill{
 height:100%;background:#39ef39;color:#111;
 display:flex;align-items:center;justify-content:center;
 font-weight:bold
}
table{width:100%;border-collapse:collapse;font-size:13px}
